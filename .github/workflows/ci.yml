name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build server
        working-directory: apps/server
        run: npm install && npm run build
      - name: Build web
        working-directory: apps/web
        run: npm install && npm run build
