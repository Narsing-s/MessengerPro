name: MessengerPro Pages Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix real account storage and search
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/app/page.tsx')
          s = p.read_text()
          marker = "type Account = { name: string; username: string; email: string; phone: string; password: string };"
          helpers = '''\n\nconst getStoredAccounts = (): Account[] => {\n  try {\n    const stored = JSON.parse(localStorage.getItem('messengerpro.accounts') || '[]');\n    if (Array.isArray(stored)) return stored as Account[];\n  } catch {}\n  try {\n    const legacy = JSON.parse(localStorage.getItem('messengerpro.account') || 'null');\n    return legacy ? [legacy as Account] : [];\n  } catch { return []; }\n};\n\nconst saveStoredAccounts = (accounts: Account[]) => {\n  localStorage.setItem('messengerpro.accounts', JSON.stringify(accounts));\n};\n'''
          if 'const getStoredAccounts = ()' not in s:
              if marker not in s: raise SystemExit('Account type marker not found')
              s = s.replace(marker, marker + helpers, 1)
          s = s.replace("const registeredAccounts = getAccounts().filter((a) => a.username.toLowerCase() !== account?.username.toLowerCase()).map((a) => ({ id: a.username, name: a.name, username: a.username, email: a.email, phone: a.phone, preview: 'Start a conversation', time: '', online: true, initials: a.name.split(/\\s+/).map((v) => v[0]).join('').slice(0,2).toUpperCase(), color: 'blue' as const }));", "const registeredAccounts: Conversation[] = getStoredAccounts().filter((a) => a.username.toLowerCase() !== account?.username.toLowerCase()).map((a: Account) => ({ id: a.username, name: a.name, preview: 'Start a conversation', time: '', online: true, initials: a.name.split(/\\s+/).map((v: string) => v[0]).join('').slice(0,2).toUpperCase(), color: 'blue' }));")
          s = s.replace("const availableContacts: Conversation[] = registeredAccounts;", "const availableContacts: Conversation[] = registeredAccounts;")
          s = s.replace("const key=newTarget.trim().toLowerCase(); const found=availableContacts.find(c=>c.name.toLowerCase().includes(key)||c.id.toLowerCase()===key||('email' in c && c.email.toLowerCase()===key)||('phone' in c && c.phone===newTarget.replace(/\\D/g,'')));", "const key=newTarget.trim().toLowerCase(); const found=availableContacts.find(c=>c.name.toLowerCase().includes(key)||c.id.toLowerCase()===key);")
          p.write_text(s)
          PY
      - name: Verify account functionality
        working-directory: apps/web
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app/page.tsx').read_text()
          for item in ['const getStoredAccounts = ()', 'messengerpro.accounts', 'const registeredAccounts: Conversation[]']:
              if item not in s: raise SystemExit(f'Missing required account functionality: {item}')
          PY
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
      - name: Build static Next.js site
        working-directory: apps/web
        env:
          GITHUB_PAGES: true
        run: npm run build
      - name: Configure SPA fallback
        run: cp apps/web/out/index.html apps/web/out/404.html
      - name: Verify Pages output
        run: |
          test -s apps/web/out/index.html
          test -s apps/web/out/404.html
          test -d apps/web/out/_next/static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
