name: MessengerPro Pages Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      # The dashboard previously called useMemo conditionally after the login
      # early-return. React then crashed on the first authenticated render.
      # Convert those two derived values to ordinary calculations for the
      # static demo build. This does not change the UI or authentication flow.
      - name: Fix authenticated dashboard render
        working-directory: apps/web
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = "const availableContacts = sampleContacts; const active = useMemo(() => availableContacts.find((c) => c.id === recipient), [recipient]); const filtered = useMemo(() => { const value = search.trim().toLowerCase(); return availableContacts.filter((c) => !value || `${c.name}`.toLowerCase().includes(value)); }, [search]);"
          new = "const availableContacts = sampleContacts; const active = availableContacts.find((c) => c.id === recipient); const filtered = availableContacts.filter((c) => { const value = search.trim().toLowerCase(); return !value || `${c.name}`.toLowerCase().includes(value); });"
          if old not in s:
              raise SystemExit('Expected dashboard calculation was not found; refusing to build an unverified Pages bundle.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build static Next.js site
        working-directory: apps/web
        env:
          GITHUB_PAGES: true
        run: npm run build

      # GitHub Pages serves 404.html for any URL it cannot resolve.
      # Use the exported app shell there so accidental client-side navigation
      # or a stale URL never strands the SPA on a GitHub 404 page.
      - name: Configure SPA fallback
        run: cp apps/web/out/index.html apps/web/out/404.html

      - name: Verify static output
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/404.html
          echo "GitHub Pages SPA output verified"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
