name: MessengerPro Pages Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch web client with backend account operations
        run: python scripts/patch-pages.py
      - name: Verify real account functionality
        working-directory: apps/web
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app/page.tsx').read_text()
          required = ['const getApiBase = () =>', '/api/auth/login', '/api/auth/register', '/api/users/search', 'const [directory, setDirectory']
          for item in required:
              if item not in s:
                  raise SystemExit(f'Missing required functionality: {item}')
          PY
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
      - name: Build static Next.js site
        working-directory: apps/web
        env:
          GITHUB_PAGES: true
        run: npm run build
      - name: Configure SPA fallback
        run: cp apps/web/out/index.html apps/web/out/404.html
      - name: Verify Pages output
        run: |
          test -s apps/web/out/index.html
          test -s apps/web/out/404.html
          test -d apps/web/out/_next/static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
