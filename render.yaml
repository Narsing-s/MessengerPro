services:
  - type: web
    name: messengerpro-api
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: ./apps/server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEB_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: messengerpro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: messengerpro-cache
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: messengerpro-cache
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: public access required by the API service

databases:
  - name: messengerpro-db
    plan: free
    postgresMajorVersion: "17"
